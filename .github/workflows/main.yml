name: VidiVerify CI/CD

on:
   push:
      branches: [master]
   pull_request:
      branches: [master]

# Allow only one concurrent deployment
concurrency:
   group: "pages-${{ github.ref }}"
   cancel-in-progress: true

jobs:
   ci:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         pages: write
         id-token: write
      timeout-minutes: 20
      steps:
         - name: Checkout code
           uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

         - name: Setup pnpm
           uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
           with:
              version: 10

         - name: Setup Node.js
           uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
           with:
              node-version: 24
              cache: "pnpm"

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Cache Puppeteer Chrome
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
           with:
              path: ~/.cache/puppeteer
              key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

         - name: Ensure Chrome for Puppeteer is installed
           run: pnpm exec puppeteer browsers install chrome

         - name: Lint code
           run: pnpm lint

         - name: Validate JSON data files
           run: |
              echo "Validating JSON data files..."
              find data -name "*.json" -exec echo "Checking {}" \; -exec node -e "JSON.parse(require('fs').readFileSync('{}', 'utf8'))" \;

         - name: Build with Vite
           run: pnpm build

         # Zwei Stufen, und das ist der Punkt: `critical` hält den Bau an,
         # alles darunter wird nur berichtet. Vorher lief der Schritt mit
         # `continue-on-error` UND `|| echo` - doppelt entschärft, also eine
         # Prüfung, die nie fehlschlagen konnte und deshalb keine war
         # (Sicherheitsprüfung 11.09.2026, Befund 4). Das Ergebnis steht
         # jetzt ausserdem in der Zusammenfassung des Laufs, statt nur im
         # Protokoll, das niemand öffnet.
         - name: Security audit (critical blocks the build)
           run: |
              set -o pipefail
              if ! pnpm audit --audit-level=critical; then
                 echo "### Sicherheitsprüfung: KRITISCHE Lücke gefunden" >> "$GITHUB_STEP_SUMMARY"
                 pnpm audit --audit-level=critical >> "$GITHUB_STEP_SUMMARY" || true
                 exit 1
              fi
              if ! pnpm audit --audit-level=high > audit_high.txt 2>&1; then
                 echo "### Sicherheitsprüfung: Lücken unterhalb von kritisch" >> "$GITHUB_STEP_SUMMARY"
                 cat audit_high.txt >> "$GITHUB_STEP_SUMMARY"
              else
                 echo "### Sicherheitsprüfung: ohne Befund" >> "$GITHUB_STEP_SUMMARY"
              fi

         - name: Setup Pages
           uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

         - name: Upload artifact
           uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
           with:
              path: "build"

   deploy:
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      permissions:
         pages: write
         id-token: write
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: ci
      steps:
         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
